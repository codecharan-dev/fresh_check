name: fresh_check
description: "FreshCheck - AI-powered food freshness detection app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Routing ───────────────────────────────────────────────────────
  go_router: ^17.1.0

  # ── State Management ──────────────────────────────────────────────
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # ── Dependency Injection ──────────────────────────────────────────
  get_it: ^9.2.1

  # ── Functional Programming ────────────────────────────────────────
  dartz: ^0.10.1

  # ── Networking ────────────────────────────────────────────────────
  dio: ^5.9.1
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^7.0.0

  # ── Local Storage ─────────────────────────────────────────────────
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0

  # ── Permissions ───────────────────────────────────────────────────
  permission_handler: ^12.0.1

  # ── Firebase ──────────────────────────────────────────────────────
  firebase_core: ^4.4.0
  firebase_remote_config: ^6.1.4
  firebase_messaging: ^16.1.1

  # ── Notifications ─────────────────────────────────────────────────
  flutter_local_notifications: ^20.1.0

  # ── Device & Media ────────────────────────────────────────────────
  device_info_plus: ^12.3.0
  image_picker: ^1.2.1

  # ── UI Components ─────────────────────────────────────────────────
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.3
  shimmer: ^3.0.0
  country_flags: ^4.1.2
  carousel_slider: ^5.1.2
  smooth_page_indicator: ^2.0.1
  flutter_styled_toast: ^2.3.0
  pinput: ^6.0.2

  # ── Utilities ─────────────────────────────────────────────────────
  intl: ^0.20.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # ── Code Generation ───────────────────────────────────────────────
  freezed: ^3.2.5
  build_runner: ^2.4.12
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # fonts:
